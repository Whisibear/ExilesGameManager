name: Public Source Validation

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  backend-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Compile public Python source
        run: python -m compileall -q app EGM_Server.py Palworld_Server.py desktop_app.py

      - name: Verify application version metadata
        run: python scripts/check_app_version.py

      - name: Import application entry point
        run: python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

  packaging-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging dependencies
        run: pip install -r requirements-build.txt

      - name: Verify packaging/runtime version sources agree
        run: python scripts/check_app_version.py

      - name: Build ExilesGameManager.exe with PyInstaller
        run: python -m PyInstaller ExilesGameManager.spec --noconfirm --clean

      - name: Build native EGM UpdateWorker
        shell: pwsh
        run: |
          $workerScript = Join-Path $PWD "scripts\Build-EGMUpdateWorker.ps1"
          $workerOutput = Join-Path $PWD "dist\ExilesGameManager\EGMUpdateWorker.exe"

          if (-not (Test-Path -LiteralPath $workerScript -PathType Leaf)) {
            throw "UpdateWorker build script not found: $workerScript"
          }

          & $workerScript -ProjectRoot $PWD.Path -OutputPath $workerOutput
          if (-not $?) {
            throw "UpdateWorker build script returned a failure."
          }

      - name: Verify packaged executables
        shell: pwsh
        run: |
          $executables = @(
            "dist\ExilesGameManager\ExilesGameManager.exe",
            "dist\ExilesGameManager\EGMUpdateWorker.exe"
          )

          foreach ($path in $executables) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required executable was not produced: $path"
            }

            $file = Get-Item -LiteralPath $path
            if ($file.Length -lt 4096) {
              throw "Executable is unexpectedly small: $path ($($file.Length) bytes)"
            }

            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path))
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "File is not a valid Windows PE executable: $path"
            }

            Write-Host "[OK] $path ($($file.Length) bytes)"
          }

          $manifest = "ExilesGameManager.manifest"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Windows application manifest is missing: $manifest"
          }
          $manifestText = Get-Content -LiteralPath $manifest -Raw
          if ($manifestText -notmatch 'requestedExecutionLevel level="asInvoker"') {
            throw "Windows manifest does not use asInvoker."
          }
          if ($manifestText -notmatch '<longPathAware[^>]*>true</longPathAware>') {
            throw "Windows manifest is not long-path aware."
          }

          $appVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path -LiteralPath "dist\ExilesGameManager\ExilesGameManager.exe")
          )
          if ($appVersion.CompanyName -ne "Whisibear") {
            throw "Unexpected CompanyName: $($appVersion.CompanyName)"
          }
          $versionSource = Get-Content -LiteralPath "app\version.py" -Raw
          $versionMatch = [regex]::Match(
            $versionSource,
            'APP_VERSION\s*=\s*"(?<version>[^"]+)"'
          )
          if (-not $versionMatch.Success) {
            throw "APP_VERSION could not be read from app\version.py"
          }
          $expectedVersion = $versionMatch.Groups['version'].Value

          if ($appVersion.ProductVersion -ne $expectedVersion) {
            throw "Unexpected ProductVersion: $($appVersion.ProductVersion); expected: $expectedVersion"
          }

          $workerVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path -LiteralPath "dist\ExilesGameManager\EGMUpdateWorker.exe")
          )
          if ($workerVersion.CompanyName -ne "Whisibear") {
            throw "Unexpected UpdateWorker CompanyName: $($workerVersion.CompanyName)"
          }
          if ($workerVersion.ProductName -ne "Exiles Game Manager") {
            throw "Unexpected UpdateWorker ProductName: $($workerVersion.ProductName)"
          }
          if ($workerVersion.ProductVersion -ne $expectedVersion) {
            throw "Unexpected UpdateWorker ProductVersion: $($workerVersion.ProductVersion); expected: $expectedVersion"
          }

          $internal = "dist\ExilesGameManager\_internal"
          if (-not (Test-Path -LiteralPath $internal -PathType Container)) { throw "PyInstaller Onedir runtime directory missing: $internal" }
          if (-not (Get-ChildItem -LiteralPath $internal -Filter "python3*.dll" -File)) { throw "Python runtime DLL missing from Onedir build." }
          if (-not (Test-Path -LiteralPath "$internal\base_library.zip" -PathType Leaf)) { throw "base_library.zip missing from Onedir build." }

          $installerSource = Get-Content -LiteralPath "installer.iss" -Raw
          if ($installerSource -notmatch 'Source:\s*"dist\\ExilesGameManager\\\*"') {
            throw "installer.iss does not package dist\ExilesGameManager\EGMUpdateWorker.exe"
          }

      - name: Smoke test native UpdateWorker startup
        shell: pwsh
        run: |
          $worker = Resolve-Path -LiteralPath "dist\ExilesGameManager\EGMUpdateWorker.exe"
          $fallbackLog = Join-Path (Split-Path -Parent $worker) "update_worker_fallback.log"
          Remove-Item -LiteralPath $fallbackLog -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $worker -PassThru -Wait
          if ($process.ExitCode -ne 2) {
            throw "UpdateWorker startup smoke test returned unexpected exit code $($process.ExitCode); expected 2 without EGM_UPDATE_JOB."
          }

          if (-not (Test-Path -LiteralPath $fallbackLog -PathType Leaf)) {
            throw "UpdateWorker did not create its expected fallback diagnostic log."
          }

          Remove-Item -LiteralPath $fallbackLog -Force
          Write-Host "[OK] Native UpdateWorker starts and validates its job handoff."

      - name: Smoke test packaged health endpoint
        shell: pwsh
        run: |
          $env:EGM_SUPPRESS_BROWSER = "1"
          $env:EGM_SUPPRESS_TRAY = "1"
          $proc = Start-Process -FilePath "dist\ExilesGameManager\ExilesGameManager.exe" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Packaged application did not answer /api/health within 30 seconds" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1

          if (-not $iscc) {
            throw "ISCC.exe not found"
          }

          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath "installer_output" -Filter "ExilesGameManager-Setup-*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $setup) {
            throw "Installer output was not produced."
          }

          if ($setup.Length -lt 1048576) {
            throw "Installer output is unexpectedly small: $($setup.Length) bytes"
          }

          $bytes = [System.IO.File]::ReadAllBytes($setup.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Installer output is not a valid Windows executable."
          }

          Write-Host "[OK] Installer: $($setup.FullName)"
          Write-Host "[OK] SHA256: $((Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash)"

      - name: Upload packaging smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: egm-packaging-smoke
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/ExilesGameManager/**
            installer_output/ExilesGameManager-Setup-*.exe
