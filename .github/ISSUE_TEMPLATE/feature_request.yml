name: Feature request
description: Suggest an improvement for Exiles Game Manager
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the concrete problem this feature would solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Requested behavior
      description: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
